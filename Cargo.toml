[package]
name = "swarm"
version = "0.3.1"
edition = "2021"
rust-version = "1.90"
resolver = "3"
description = "A terminal mission control for a team of Claude Code, Codex and Antigravity agents that build web pages or any software project together, prove it with your tests, and keep taking orders while you talk to them"
license = "MIT"
repository = "https://github.com/ibrahemassa/swarm"
readme = "README.md"
keywords = ["ai-agents", "claude-code", "codex", "tui", "multi-agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
