[package]
name = "swarm"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
resolver = "3"
description = "A swarm of Claude / Codex / Antigravity agents building a web page together, on a dashboard that looks unreasonably busy"

[dependencies]
ratatui = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
